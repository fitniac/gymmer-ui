<?xml version="1.0" encoding="UTF-8"?>
<!--
  GYMMER mark.

  Geometry: centre (512,512); one ring, R 367.43 to 256.59 - a stroke 110.84
  wide, 0.151 of the mark's 734.86 diameter. Every straight is axis aligned,
  every chamfer a true 45 degrees, every curve an exact arc tangent to its
  straights.

  ONE ring, not two. The mark was a double ring until 2026-10-30; the watch app
  had shipped this single-line one since its first build, and nothing compared
  them because they lived in different repositories. The difference is not a
  restyle: the single ring is 1.6x heavier relative to its diameter (0.151
  against 0.093), so thinning or thickening is the one edit that changes which
  mark this is.

  Fill is a 45 degree gradient, accent at top left to accent deep at bottom
  right. The extent is 144.57..882.51 across and 144.59..879.41 down - NOT
  square, because the chamfered bar tip now reaches past the ring's right edge
  instead of sitting inside it. The gradient therefore runs corner to corner of
  the SQUARE 144.57..882.51, which covers the mark and keeps dx equal to dy, so
  the 45 degrees holds at any rendered size.

  INLINE this markup into the DOM so the gradient inherits the accent tokens
  from html[data-accent] + html[data-theme]. Paste it, or add an svg-to-component
  loader in the CONSUMING app (the layer ships none, and must not add one).
  Do NOT reference it via <img src>: an external image cannot see document tokens.
  Inlining twice on one page duplicates the gradient id, which is harmless only
  because both definitions are identical; give one a suffix if you ever fork it.

  Standalone use (favicon, og image, a design tool) has no document to inherit
  from, so it falls back to light orange. Add data-accent="green" | "cyan" |
  "orange" to the <svg> to pin a palette; those blocks also honour the OS dark
  preference. Leave the attribute OFF when inlining, or it overrides the live
  accent. The literals in <style> are the only place this file names a colour,
  and they exist solely for that no-document case.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img">
  <title>GYMMER</title>
  <style>
    svg[data-accent="orange"] { --acc: #ec3013; --acc-deep: #ae1800 }
    svg[data-accent="green"]  { --acc: #16a34a; --acc-deep: #14663a }
    svg[data-accent="cyan"]   { --acc: #0891b2; --acc-deep: #0b5e75 }
    @media (prefers-color-scheme: dark) {
      svg[data-accent="orange"] { --acc: #ff563c; --acc-deep: #ff9783 }
      svg[data-accent="green"]  { --acc: #22c55e; --acc-deep: #7ee2a8 }
      svg[data-accent="cyan"]   { --acc: #22b8d6; --acc-deep: #7fdcee }
    }
  </style>
  <defs>
    <linearGradient id="gm-logo-acc" gradientUnits="userSpaceOnUse" x1="144.57" y1="144.57" x2="882.51" y2="882.51">
      <stop offset="0" stop-color="var(--acc, #ec3013)"/>
      <stop offset="1" stop-color="var(--acc-deep, #ae1800)"/>
    </linearGradient>
  </defs>
  <path fill="url(#gm-logo-acc)" fill-rule="evenodd" d="
    M842.55 184.55 771.7 255.41 512 255.41Q459.78 255.41 412.13 275.56Q366.09 295.04 330.56 330.56Q295.04 366.09 275.56 412.13Q255.41 459.78 255.41 512Q255.41 564.22 275.56 611.87Q295.04 657.91 330.56 693.44Q366.09 728.96 412.13 748.44Q459.78 768.59 512 768.59Q564.22 768.59 611.87 748.44Q657.91 728.96 693.44 693.44Q728.96 657.91 748.44 611.87Q764.03 575.01 767.56 535.41H488.59V424.59H869.38L872.99 443.65Q883.67 500.07 876.67 556.9Q869.82 612.49 846.67 663.59Q823.53 714.69 786.26 756.5Q748.16 799.25 698.7 828.43Q649.23 857.62 593.4 870.3Q538.78 882.7 482.86 878.25Q426.94 873.8 374.97 852.92Q321.83 831.57 277.61 794.93Q233.38 758.29 202.52 710.06Q172.34 662.88 157.56 608.77Q142.79 554.65 144.81 498.68Q146.88 441.45 166.35 387.43Q185.83 333.4 220.74 288.01Q254.89 243.62 300.79 211.37Q346.69 179.12 400.03 162.05Q454.57 144.59 512 144.59L882.51 144.59Z
  "/>
</svg>
