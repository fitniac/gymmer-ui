<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Header logo variants</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}width:1160px;height:860px;box-sizing:border-box;padding:40px 48px;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;gap:14px">
<div style="display:grid;grid-template-columns:230px 340px 340px 64px;gap:16px;align-items:end;padding-bottom:6px;border-bottom:1px solid var(--line)">
<h1 style="margin:0;font-size:26px;font-weight:800;font-stretch:110%">Header logo</h1>
<span style="font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted)">DARK</span>
<span style="font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted)">LIGHT</span>
<span style="font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted)">BUTTON</span>
</div>

<sc-for list="{{rows}}" as="v" hint-placeholder-count="8">
<div style="display:grid;grid-template-columns:230px 340px 340px 64px;gap:16px;align-items:center">
<div style="display:flex;gap:10px;align-items:baseline"><span style="font:600 12px var(--mono);color:var(--acc-ink)">{{v.n}}</span><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">{{v.name}}</span><span style="font-size:12px;color:var(--muted)">{{v.note}}</span></span></div>

<sc-for list="{{v.cells}}" as="c" hint-placeholder-count="2">
<div style="height:64px;box-sizing:border-box;padding:0 12px 0 18px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;{{c.box}}">
<span style="display: flex; align-items: center; gap: 1px; font-size: 20px">
<sc-if value="{{c.tile}}" hint-placeholder-val="{{ false }}"><span style="width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:{{c.acc}}"><svg width="24" height="24" viewBox="{{c.mvb}}" aria-hidden="true"><path fill-rule="evenodd" d="{{c.md}}" style="fill:{{c.onAcc}}"></path></svg></span></sc-if>
<sc-if value="{{c.mark}}" hint-placeholder-val="{{ true }}"><svg width="{{c.ms}}" height="{{c.ms}}" viewBox="{{c.mvb}}" aria-hidden="true" style="width: 24px; height: 22px"><path fill-rule="evenodd" d="{{c.md}}" style="fill:{{c.acc}}"></path></svg></sc-if>
<sc-if value="{{c.letters}}" hint-placeholder-val="{{ true }}"><svg width="68" height="14" viewBox="1496 -1432 6931 1432" aria-hidden="true" style="width: 87px; height: 24px"><path d="{{c.ld}}" transform="translate(1502.5 0)" style="fill:{{c.letterFill}}"></path></svg></sc-if>
<sc-if value="{{c.inline}}" hint-placeholder-val="{{ false }}"><svg width="112" height="19" viewBox="{{c.ivb}}" aria-hidden="true"><path fill-rule="evenodd" d="{{c.md}}" transform="{{c.itf}}" style="fill:{{c.acc}}"></path><path d="{{c.ld}}" transform="{{c.ltf}}" style="fill:{{c.ink}}"></path></svg></sc-if>
</span>
<span style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px var(--font);{{c.avatar}}">IF</span>
</div>
</sc-for>

<span style="width:56px;height:56px;border-radius:50%;background:{{v.acc}};display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--bg), 0 0 0 4px var(--line)"><svg width="30" height="30" viewBox="{{v.mvb}}" aria-hidden="true"><path fill-rule="evenodd" d="{{v.md}}" style="fill:{{v.onAcc}}"></path></svg></span>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff563c","options":["#ff563c","#c8f031","#5cc8ff","#a08bff"]},"$preview":{"width":1160,"height":860}}'>

    var n = parseInt(h, 16);
    var L = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    L = 0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2];
    var onAcc = L > 0.179 ? '#141312' : '#ffffff';
    var S = 'M842.55 184.55 771.7 255.41 512 255.41Q459.78 255.41 412.13 275.56Q366.09 295.04 330.56 330.56Q295.04 366.09 275.56 412.13Q255.41 459.78 255.41 512Q255.41 564.22 275.56 611.87Q295.04 657.91 330.56 693.44Q366.09 728.96 412.13 748.44Q459.78 768.59 512 768.59Q564.22 768.59 611.87 748.44Q657.91 728.96 693.44 693.44Q728.96 657.91 748.44 611.87Q764.03 575.01 767.56 535.41H488.59V424.59H869.38L872.99 443.65Q883.67 500.07 876.67 556.9Q869.82 612.49 846.67 663.59Q823.53 714.69 786.26 756.5Q748.16 799.25 698.7 828.43Q649.23 857.62 593.4 870.3Q538.78 882.7 482.86 878.25Q426.94 873.8 374.97 852.92Q321.83 831.57 277.61 794.93Q233.38 758.29 202.52 710.06Q172.34 662.88 157.56 608.77Q142.79 554.65 144.81 498.68Q146.88 441.45 166.35 387.43Q185.83 333.4 220.74 288.01Q254.89 243.62 300.79 211.37Q346.69 179.12 400.03 162.05Q454.57 144.59 512 144.59L882.51 144.59Z';
    var D = 'M826 168 762 232H512C357.36 232 232 357.36 232 512C232 666.64 357.36 792 512 792C666.64 792 792 666.64 792 512H512V448H849.99C876.97 590.48 811.7 734.58 686.8 808.27C561.91 881.96 404.21 869.42 292.54 776.91C180.87 684.39 139.2 531.79 188.37 395.36C237.54 258.94 366.99 168 512 168H826ZM708 286 644 350H512C439.29 350 375.49 398.45 355.96 468.48C336.43 538.52 365.95 612.99 428.16 650.62C490.38 688.25 570.04 679.82 623 630H512V566H731.45C703.31 680.36 592.06 753.95 475.8 735.08C359.54 716.22 277.26 611.24 286.73 493.84C296.19 376.45 394.22 286 512 286H708Z';
    var LET = 'M1385 0 1386 -1432H1652L2125 -310L2602 -1432H2864V0H2656V-1087L2205 0H2040L1598 -1073V0ZM3118 0 3119 -1432H3385L3858 -310L4335 -1432H4597V0H4389V-1087L3938 0H3773L3331 -1073V0ZM5884 0V-1432H6383Q6595 -1432 6726 -1319.5Q6857 -1207 6857 -1008V-1007Q6857 -819 6727.5 -701.5Q6653.6 -634.4 6557.3 -605.6L6924 0H6677L6328 -584H6105V0ZM4851 0V-1432H5677V-1241H5073V-815H5621V-633H5073V-190H5683V0ZM508 0V-620.8L-6 -1432H240L577 -901L622 -829L665 -898L1003 -1432H1244L728 -623.8V0ZM6105 -762H6366Q6492 -762 6564.5 -824Q6637 -886 6637 -1004V-1005Q6637 -1120 6563.5 -1182.5Q6490 -1245 6364 -1245H6105V-762Z';
    var single = { md: S, mvb: '140 140 748 748', ivb: '0 -1432 8432.5 1432', itf: 'translate(0.0 -1432.0) scale(1.948753) translate(-144.57 -144.59)', ltf: 'translate(1508.5 0)' };
    var dbl = { md: D, mvb: '164 164 696 696', ivb: '0 -1432 8426.5 1432', itf: 'translate(0.0 -1432.0) scale(2.081388) translate(-167.98 -168.00)', ltf: 'translate(1502.5 0)' };
    var defs = [
      ['A', 'Single G + YMMER', 'One-line G, 30px, letters 14px', single, { mark: true, letters: true, ms: 30 }],
      ['B', 'Double G + YMMER', 'Current Today header', dbl, { mark: true, letters: true, ms: 30 }],
      ['C', 'Single G, inline', 'G at letter height — reads GYMMER', single, { inline: true }],
      ['D', 'Double G, inline', 'G at letter height — reads GYMMER', dbl, { inline: true }],
      ['E', 'Single G tile + YMMER', 'App-icon tile, G knocked out', single, { tile: true, letters: true }],
      ['F', 'Double G tile + YMMER', 'App-icon tile, G knocked out', dbl, { tile: true, letters: true }],
      ['G', 'Double G, quiet letters', 'G 34px, YMMER in muted grey', dbl, { mark: true, letters: true, ms: 34, quiet: true }],
      ['H', 'Single G only', 'No wordmark — G as the whole logo', single, { mark: true, ms: 32 }]
    ];
    var themes = [
      { box: 'background:#141312;border:1px solid rgba(239,235,231,0.12)', ink: '#efebe7', muted: '#959089', avatar: 'background:#1d1b1a;color:#efebe7;border:1px solid rgba(239,235,231,0.12)' },
      { box: 'background:#f5f3f1;border:1px solid rgba(29,27,26,0.12)', ink: '#1d1b1a', muted: '#6a6663', avatar: 'background:#ffffff;color:#1d1b1a;border:1px solid rgba(29,27,26,0.12)' }
    ];
    return {
      vars: '--acc:' + acc + ';--acc-ink:' + acc + ';--bg:#141312;--surf:#1d1b1a;--ink:#efebe7;--muted:#959089;--line:rgba(239,235,231,0.12);--font:Archivo, system-ui, sans-serif;--mono:IBM Plex Mono, ui-monospace, monospace;',
      acc: acc, onAcc: onAcc, ld: LET,
      rows: defs.map(function (d) {
        var g = d[3], o = d[4];
        var base = {
          acc: acc, onAcc: onAcc, ld: LET, md: g.md, mvb: g.mvb, ivb: g.ivb, itf: g.itf, ltf: g.ltf,
          mark: !!o.mark, letters: !!o.letters, inline: !!o.inline, tile: !!o.tile, ms: String(o.ms || 30)
        };
        return Object.assign({}, base, {
          n: d[0], name: d[1], note: d[2],
          cells: themes.map(function (t) {
            return Object.assign({}, base, { box: t.box, ink: t.ink, avatar: t.avatar, gap: o.tile ? 'gap:10px' : 'gap:8px', letterFill: o.quiet ? t.muted : t.ink });

}
</script>
</body>
</html>
