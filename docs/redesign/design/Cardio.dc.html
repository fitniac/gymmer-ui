<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Active workout — timed cardio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:is(h1,h2,h3,[style*="font-stretch"]):not([style*="var(--mono)"]){font-family:var(--display)!important}
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
.live{animation:breathe 2s ease-in-out infinite}
.tap{transition:transform .12s ease-out}
.tap:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="{{vars}}width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column">

<header>
<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 8px 0">
<a href="Dashboard.dc.html" aria-label="Minimise workout" class="tap" style="justify-self:start;width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6" /></svg></a>
<div style="display:flex;flex-direction:column;align-items:center"><span style="font-size:15px;font-weight:700">Chest Day</span><span style="font:600 12px var(--mono);color:var(--acc-ink)">03:12</span></div>
<a href="Summary.dc.html" class="tap" style="justify-self:end;height:44px;padding:0 10px;display:flex;align-items:center;text-decoration:none;font-weight:700;font-size:15px;color:var(--acc-ink)">Finish</a>
</div>
<div style="padding:8px 16px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px"><span style="height:4px;border-radius:2px;background:var(--raised);overflow:hidden"><span style="display:block;width:64%;height:100%;background:var(--acc)"></span></span><span style="height:4px;border-radius:2px;background:var(--raised)"></span><span style="height:4px;border-radius:2px;background:var(--raised)"></span><span style="height:4px;border-radius:2px;background:var(--raised)"></span></div>
</header>

<section style="padding:6px 20px 0;display:flex;flex-direction:column;gap:3px">
<span style="font:500 11px var(--mono);letter-spacing:.07em;color:var(--muted)">WARM-UP · EXERCISE 1 OF 4</span>
<h1 style="margin:0;font-size:24px;font-weight:800">Treadmill Jogging</h1>
</section>

<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
<div style="position:relative;width:208px;height:208px">
<svg width="208" height="208" viewBox="0 0 120 120" style="transform:rotate(-90deg)"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--raised)" stroke-width="6" /><circle cx="60" cy="60" r="54" fill="none" stroke="var(--acc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="122" /></svg>
<span style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="live" style="font:600 10px var(--mono);letter-spacing:.1em;color:var(--acc-ink)">● RUNNING</span><span style="font-size:58px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em">3:12</span><span style="font:500 12px var(--mono);color:var(--muted)">TARGET 5:00</span></span>
</div>
<span style="font-size:15px;color:var(--body)">Easy pace — you should be able to talk.</span>
</div>

<sc-if value="{{isFree}}" hint-placeholder-val="{{ true }}">
<aside aria-label="Advertisement" style="margin:0 16px 14px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden">
<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 10px;border-bottom:1px solid var(--line)"><span style="font:600 10px var(--mono);letter-spacing:.1em;color:var(--muted)">AD</span><a href="Pro.dc.html" style="font-size:12px;font-weight:600;color:var(--acc-ink);text-decoration:none;padding:6px 0">Remove ads with Pro</a></div>
<div style="height:72px;background:repeating-linear-gradient(135deg,var(--bg) 0 8px,var(--raised) 8px 16px);display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);color:var(--muted)">[native ad · 320×72 · no sound]</div>
</aside>
</sc-if>

<section style="padding:0 16px;display:flex;flex-direction:column;gap:8px">
<span style="padding:0 4px;font:600 11px var(--mono);letter-spacing:.07em;color:var(--muted)">OPTIONAL — ADD IF YOU TRACK IT</span>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<button class="tap" style="height:62px;border-radius:var(--rs);border:1.5px dashed var(--line);background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 15px var(--font)">+ Distance<span style="font:500 10px var(--mono);color:var(--muted)">KM</span></button>
<button class="tap" style="height:62px;border-radius:var(--rs);border:0;background:var(--surf);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 17px var(--font)">8.5<span style="font:500 10px var(--mono);color:var(--muted)">SPEED KM/H</span></button>
<button class="tap" style="height:62px;border-radius:var(--rs);border:1.5px dashed var(--line);background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 15px var(--font)">+ Incline<span style="font:500 10px var(--mono);color:var(--muted)">%</span></button>
</div>
</section>

<div style="padding:16px 16px 30px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px">
<button aria-label="Pause" class="tap" style="height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg></button>
<a href="Active.dc.html" class="tap" style="height:56px;border-radius:999px;background:var(--acc);color:var(--on-acc);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12.5 10 17 19 7" /></svg>Done, next exercise</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff563c","options":["#ff563c","#c8f031","#5cc8ff","#a08bff"]},"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"corner":{"editor":"enum","options":["square","soft","round"],"default":"soft"},"plan":{"editor":"enum","options":["free","pro"],"default":"free"},"type":{"editor":"enum","options":["Archivo + Plex Mono","Archivo + Google Sans Flex"],"default":"Archivo + Google Sans Flex"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    var p = this.props;
    var acc = p.accent || '#ff563c', mode = p.mode || 'dark', corner = p.corner || 'soft', dark = mode !== 'light';
    var h = acc.replace('#', ''); if (h.length === 3) { h = h.split('').map(function (c) { return c + c; }).join(''); }
    var n = parseInt(h, 16);
    var L = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    L = 0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2];
    var t = dark ? { bg: '#141312', surf: '#1d1b1a', raised: '#2a2725', ink: '#efebe7', body: '#c4beb8', muted: '#959089', line: 'rgba(239,235,231,0.12)' }
                 : { bg: '#f5f3f1', surf: '#ffffff', raised: '#e9e6e3', ink: '#1d1b1a', body: '#43403e', muted: '#6a6663', line: 'rgba(29,27,26,0.12)' };
    var r = corner === 'square' ? 0 : (corner === 'round' ? 20 : 12);
    return '--acc:' + acc + ';--on-acc:' + (L > 0.179 ? '#141312' : '#ffffff') + ';--acc-ink:' + (dark ? acc : 'color-mix(in oklch, ' + acc + ' 62%, #000)') +
      ';--acc-soft:color-mix(in srgb, ' + acc + ' 16%, transparent);--bg:' + t.bg + ';--surf:' + t.surf + ';--raised:' + t.raised + ';--ink:' + t.ink +
      ';--body:' + t.body + ';--muted:' + t.muted + ';--line:' + t.line + ';--r:' + r + 'px;--rs:' + Math.round(r * 0.6) + 'px;--display:Archivo, system-ui, sans-serif;' + (p.type === 'Archivo + Plex Mono' ? '--font:Archivo, system-ui, sans-serif;--mono:IBM Plex Mono, ui-monospace, monospace;' : '--font:Google Sans Flex, Archivo, system-ui, sans-serif;--mono:Google Sans Flex, system-ui, sans-serif;');
  }
  renderVals() { return { vars: this.theme(), isFree: (this.props.plan || 'free') === 'free' }; }
}
</script>
</body>
</html>
