<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress — body map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:is(h1,h2,h3,[style*="font-stretch"]):not([style*="var(--mono)"]){font-family:var(--display)!important}
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.in{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.tap{transition:transform .12s ease-out,background-color .2s}
.tap:active{transform:scale(.97)}
.scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="{{vars}}width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)">
<main class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding-bottom:40px;box-sizing:border-box">

<div style="display:flex;align-items:center;padding:6px 8px 0"><a href="Dashboard.dc.html" class="tap" style="height:44px;display:flex;align-items:center;gap:2px;padding:0 8px;text-decoration:none;color:var(--acc-ink);font-size:16px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6" /></svg>Today</a></div>
<h1 style="margin:4px 20px 12px;font-size:34px;font-weight:800;font-stretch:112%;letter-spacing:-.02em">Progress</h1>

<div role="tablist" aria-label="Range" style="margin:0 20px;padding:4px;border-radius:999px;background:var(--surf);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px">
<button role="tab" aria-selected="true" style="height:40px;border:0;border-radius:999px;background:var(--bg);color:var(--ink);font:700 14px var(--font);box-shadow:0 1px 3px rgba(0,0,0,.25)">30 days</button>
<a href="Pro.dc.html" role="tab" aria-selected="false" style="height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;color:var(--muted);font:700 14px var(--font)">Year<span style="font:700 9px var(--mono);padding:2px 4px;border-radius:3px;background:var(--raised);color:var(--body)">PRO</span></a>
<a href="Pro.dc.html" role="tab" aria-selected="false" style="height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;color:var(--muted);font:700 14px var(--font)">All<span style="font:700 9px var(--mono);padding:2px 4px;border-radius:3px;background:var(--raised);color:var(--body)">PRO</span></a>
</div>

<section style="margin:16px 16px 0;padding:14px 10px 12px;border-radius:var(--r);background:var(--surf);display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;padding:0 6px;font-size:13px"><b>What you trained</b><span style="color:var(--muted)">tap a muscle</span></div>
<div style="height:300px"><dc-import name="BodyMap" levels="{{levels}}" focus="{{focus}}" hint-size="100%,300px"></dc-import></div>
<div aria-label="Legend" style="display:flex;justify-content:center;gap:12px;font:500 10px var(--mono);color:var(--muted)">
<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:var(--raised)"></span>NONE</span>
<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:color-mix(in srgb, var(--acc) 38%, var(--raised))"></span>LIGHT</span>
<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:color-mix(in srgb, var(--acc) 68%, var(--raised))"></span>MODERATE</span>
<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:var(--acc)"></span>HEAVY</span>
</div>
</section>

<div class="scroll" role="group" aria-label="Muscles" style="display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button aria-pressed="{{c.on}}" class="tap" onClick="{{c.pick}}" style="flex:0 0 auto;height:38px;padding:0 14px;border-radius:999px;font:600 14px var(--font);display:flex;align-items:center;gap:6px;{{c.style}}">{{c.n}}<span style="font:500 11px var(--mono);opacity:.75">{{c.v}}</span></button>
</sc-for>
</div>

<sc-if value="{{hasFocus}}" hint-placeholder-val="{{ true }}">
<section class="in" style="margin:12px 16px 0;padding:16px;border-radius:var(--r);background:var(--surf);display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:20px">{{sel.n}}</b><span style="font:600 12px var(--mono);color:var(--acc-ink)">{{sel.v}} SETS · 30D</span></div>
<span style="font-size:13px;color:var(--muted)">Last trained {{sel.last}}</span>
<sc-for list="{{sel.ex}}" as="e" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--line)"><span style="flex:0 0 33px;height:44px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--surf) 0 6px,var(--raised) 6px 12px)"></span><span style="flex:1;font-size:14px;font-weight:600">{{e.n}}</span><span style="font:500 12px var(--mono);color:var(--muted)">{{e.s}}</span></div>
</sc-for>
</section>
</sc-if>
<sc-if value="{{noFocus}}" hint-placeholder-val="{{ false }}">
<p style="margin:12px 20px 0;font-size:14px;line-height:1.45;color:var(--muted)">Hamstrings and calves haven’t been trained in 30 days. Tap a muscle to see the sessions behind it.</p>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff563c","options":["#ff563c","#c8f031","#5cc8ff","#a08bff"]},"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"corner":{"editor":"enum","options":["square","soft","round"],"default":"soft"},"type":{"editor":"enum","options":["Archivo + Plex Mono","Archivo + Google Sans Flex"],"default":"Archivo + Google Sans Flex"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    var p = this.props;
    var acc = p.accent || '#ff563c', mode = p.mode || 'dark', corner = p.corner || 'soft', dark = mode !== 'light';
    var h = acc.replace('#', ''); if (h.length === 3) { h = h.split('').map(function (c) { return c + c; }).join(''); }
    var n = parseInt(h, 16);
    var L = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    L = 0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2];
    var t = dark ? { bg: '#141312', surf: '#1d1b1a', raised: '#2a2725', ink: '#efebe7', body: '#c4beb8', muted: '#959089', line: 'rgba(239,235,231,0.12)' }
                 : { bg: '#f5f3f1', surf: '#ffffff', raised: '#e9e6e3', ink: '#1d1b1a', body: '#43403e', muted: '#6a6663', line: 'rgba(29,27,26,0.12)' };
    var r = corner === 'square' ? 0 : (corner === 'round' ? 20 : 12);
    return '--acc:' + acc + ';--on-acc:' + (L > 0.179 ? '#141312' : '#ffffff') + ';--acc-ink:' + (dark ? acc : 'color-mix(in oklch, ' + acc + ' 62%, #000)') +
      ';--acc-soft:color-mix(in srgb, ' + acc + ' 16%, transparent);--bg:' + t.bg + ';--surf:' + t.surf + ';--raised:' + t.raised + ';--ink:' + t.ink +
      ';--body:' + t.body + ';--muted:' + t.muted + ';--line:' + t.line + ';--r:' + r + 'px;--rs:' + Math.round(r * 0.6) + 'px;--display:Archivo, system-ui, sans-serif;' + (p.type === 'Archivo + Plex Mono' ? '--font:Archivo, system-ui, sans-serif;--mono:IBM Plex Mono, ui-monospace, monospace;' : '--font:Google Sans Flex, Archivo, system-ui, sans-serif;--mono:Google Sans Flex, system-ui, sans-serif;');
  }
  renderVals() {
    var self = this;
    var focus = (this.state && this.state.focus !== undefined) ? this.state.focus : 'chest';
    var data = [
      ['chest', 'Chest', 42, 3, 'Tuesday', [['Decline Barbell Bench Press', '12 sets'], ['Incline Cable Press', '9 sets']]],
      ['shoulders', 'Shoulders', 24, 2, 'Monday', [['Overhead Press', '10 sets'], ['Lateral Raise', '8 sets']]],
      ['lats', 'Lats', 22, 3, 'Tuesday', [['Bent Over Barbell Row', '9 sets'], ['Lat Pulldown', '8 sets']]],
      ['triceps', 'Triceps', 18, 2, 'Tuesday', [['Triceps Dips', '8 sets'], ['Cable Pushdown', '6 sets']]],
      ['rhomboids', 'Rhomboids', 14, 2, 'Tuesday', [['Bent Over Barbell Row', '9 sets'], ['Face Pull', '5 sets']]],
      ['biceps', 'Biceps', 12, 1, 'Last week', [['Preacher Curl', '6 sets'], ['Hammer Curl', '6 sets']]],
      ['quads', 'Quads', 8, 1, 'Monday', [['Back Squat', '5 sets'], ['Leg Press', '3 sets']]],
      ['abs', 'Abs', 6, 1, 'Last week', [['Hanging Knee Raise', '6 sets']]],
      ['glutes', 'Glutes', 4, 1, 'Monday', [['Hip Thrust', '4 sets']]],
      ['hamstrings', 'Hamstrings', 0, 0, 'over 30 days ago', []]
    ];
    var levels = {}; data.forEach(function (d) { levels[d[0]] = d[3]; });
    var cur = data.filter(function (d) { return d[0] === focus; })[0];
    return {
      vars: this.theme(),
      levels: levels, focus: focus,
      hasFocus: !!cur, noFocus: !cur,
      chips: data.map(function (d) {
        var on = d[0] === focus;
        return { n: d[1], v: String(d[2]), on: on ? 'true' : 'false', pick: function () { self.setState({ focus: on ? '' : d[0] }); },
          style: on ? 'border:1px solid var(--acc);background:var(--acc);color:var(--on-acc)' : 'border:1px solid var(--line);background:var(--surf);color:var(--ink)' };
      }),
      sel: cur ? { n: cur[1], v: String(cur[2]), last: cur[4], ex: cur[5].map(function (e) { return { n: e[0], s: e[1] }; }) } : { n: '', v: '', last: '', ex: [] }
    };
  }
}
</script>
</body>
</html>
