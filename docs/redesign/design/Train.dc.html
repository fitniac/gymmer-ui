<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Train — start a workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:is(h1,h2,h3,[style*="font-stretch"]):not([style*="var(--mono)"]){font-family:var(--display)!important}
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes scrim{from{opacity:0}to{opacity:1}}
.sheet{animation:sheet .45s cubic-bezier(.32,.72,0,1) both}
.scrim{animation:scrim .25s ease-out both}
.tap{transition:transform .12s ease-out}
.tap:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="{{vars}}width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)">

<div aria-hidden="true" style="position:absolute;inset:0;padding:22px 20px;display:flex;flex-direction:column;gap:14px">
<span style="font-size:32px;font-weight:800;font-stretch:112%">Hello, Igor.</span>
<span style="height:180px;border-radius:var(--r);background:var(--surf)"></span>
<span style="height:60px;border-radius:var(--r);background:var(--surf)"></span>
</div>
<div class="scrim" style="position:absolute;inset:0;background:rgba(0,0,0,.5)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="tt" class="sheet" style="position:absolute;left:0;right:0;bottom:0;border-radius:calc(var(--r) * 2) calc(var(--r) * 2) 0 0;background:var(--surf);padding:10px 16px 30px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.35)">
<span aria-hidden="true" style="align-self:center;width:38px;height:5px;border-radius:3px;background:var(--line)"></span>
<h2 id="tt" style="margin:0 4px;font-size:24px;font-weight:800;font-stretch:110%">Start a workout</h2>

<a href="Active.dc.html" class="tap" style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r);background:var(--bg);border:2px solid var(--acc);text-decoration:none">
<span style="display:flex;justify-content:space-between;font:600 11px var(--mono);letter-spacing:.07em"><span style="color:var(--acc-ink)">UP NEXT</span><span style="color:var(--muted)">~45 MIN</span></span>
<span style="font-size:22px;font-weight:800">Chest Day</span>
<ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--body)">
<li style="display:flex;justify-content:space-between"><span>Treadmill Jogging</span><span style="font-family:var(--mono);color:var(--muted)">5 min</span></li>
<li style="display:flex;justify-content:space-between"><span>Decline Barbell Bench Press</span><span style="font-family:var(--mono);color:var(--muted)">3×10</span></li>
<li style="display:flex;justify-content:space-between"><span>Incline Dumbbell Hammer Press</span><span style="font-family:var(--mono);color:var(--muted)">3×10</span></li>
<li style="display:flex;justify-content:space-between"><span>Incline Cable Press</span><span style="font-family:var(--mono);color:var(--muted)">3×10</span></li>
</ol>
<span style="height:52px;border-radius:999px;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor" /></svg>Start Chest Day</span>
</a>

<div style="display:flex;flex-direction:column;border-radius:var(--r);background:var(--bg);overflow:hidden">
<a href="Programs.dc.html" style="display:flex;align-items:center;gap:14px;padding:0 14px;min-height:60px;border-bottom:1px solid var(--line);text-decoration:none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="5" y="4" width="14" height="17" rx="2" /><path d="M9 9h6M9 13h6M9 17h4" /></svg>
<span style="flex:1;font-size:16px;font-weight:600">Choose another program</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="m9 18 6-6-6-6" /></svg></a>
<a href="Active.dc.html" style="display:flex;align-items:center;gap:14px;padding:0 14px;min-height:60px;text-decoration:none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" /></svg>
<span style="flex:1;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600">Empty workout</span><span style="font-size:13px;color:var(--muted)">Add exercises as you go</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="m9 18 6-6-6-6" /></svg></a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff563c","options":["#ff563c","#c8f031","#5cc8ff","#a08bff"]},"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"corner":{"editor":"enum","options":["square","soft","round"],"default":"soft"},"type":{"editor":"enum","options":["Archivo + Plex Mono","Archivo + Google Sans Flex"],"default":"Archivo + Google Sans Flex"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    var p = this.props;
    var acc = p.accent || '#ff563c', mode = p.mode || 'dark', corner = p.corner || 'soft', dark = mode !== 'light';
    var h = acc.replace('#', ''); if (h.length === 3) { h = h.split('').map(function (c) { return c + c; }).join(''); }
    var n = parseInt(h, 16);
    var L = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    L = 0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2];
    var t = dark ? { bg: '#141312', surf: '#1d1b1a', raised: '#2a2725', ink: '#efebe7', body: '#c4beb8', muted: '#959089', line: 'rgba(239,235,231,0.12)' }
                 : { bg: '#f5f3f1', surf: '#ffffff', raised: '#e9e6e3', ink: '#1d1b1a', body: '#43403e', muted: '#6a6663', line: 'rgba(29,27,26,0.12)' };
    var r = corner === 'square' ? 0 : (corner === 'round' ? 20 : 12);
    return '--acc:' + acc + ';--on-acc:' + (L > 0.179 ? '#141312' : '#ffffff') + ';--acc-ink:' + (dark ? acc : 'color-mix(in oklch, ' + acc + ' 62%, #000)') +
      ';--acc-soft:color-mix(in srgb, ' + acc + ' 16%, transparent);--bg:' + t.bg + ';--surf:' + t.surf + ';--raised:' + t.raised + ';--ink:' + t.ink +
      ';--body:' + t.body + ';--muted:' + t.muted + ';--line:' + t.line + ';--r:' + r + 'px;--rs:' + Math.round(r * 0.6) + 'px;--display:Archivo, system-ui, sans-serif;' + (p.type === 'Archivo + Plex Mono' ? '--font:Archivo, system-ui, sans-serif;--mono:IBM Plex Mono, ui-monospace, monospace;' : '--font:Google Sans Flex, Archivo, system-ui, sans-serif;--mono:Google Sans Flex, system-ui, sans-serif;');
  }
  renderVals() { return { vars: this.theme() }; }
}
</script>
</body>
</html>
