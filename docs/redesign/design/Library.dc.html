<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GYMMER — Exercise library (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:is(h1,h2,h3,[style*="font-stretch"]):not([style*="var(--mono)"]){font-family:var(--display)!important}
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.tap{transition:transform .12s ease-out,background-color .2s,color .2s}
.tap:active{transform:scale(.97)}
.snap::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="{{vars}}width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)">
<main class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding-bottom:110px;box-sizing:border-box">

<header style="padding:18px 20px 4px;display:flex;flex-direction:column;gap:4px">
<h1 style="margin:0;font-size:34px;line-height:1.05;font-weight:800;font-stretch:112%;letter-spacing:-.02em">Library</h1>
<p style="margin:0;font-size:15px;color:var(--muted)">412 exercises, each checked by a human.</p>
</header>
<div role="tablist" aria-label="Library" style="margin:10px 20px 0;display:flex"><a href="Library.dc.html" role="tab" aria-selected="true" style="flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:15px;font-weight:700;color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)">Exercises<span style="font:500 11px var(--mono);color:var(--muted)">412</span></a><a href="ProgramsLib.dc.html" role="tab" aria-selected="false" style="flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:15px;font-weight:600;color:var(--muted);box-shadow:inset 0 -1px 0 var(--line)">Programs<span style="font:500 11px var(--mono);color:var(--muted)">31</span></a></div>

<div style="position:sticky;top:0;z-index:5;padding:12px 20px;display:flex;gap:8px;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)">
<label for="q" style="flex:1;height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:999px;background:var(--surf);border:1px solid var(--line);color:var(--muted)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
<input id="q" type="search" placeholder="Search exercises" aria-label="Search exercises" style="flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px var(--font);outline:none">
</label>
<button class="tap" aria-label="Filters" style="width:48px;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11" /><circle cx="16" cy="6" r="2.2" /><circle cx="10" cy="12" r="2.2" /><circle cx="18" cy="18" r="2.2" /></svg></button>
</div>

<div role="tablist" aria-label="Browse by" style="margin:4px 20px 14px;padding:4px;border-radius:999px;background:var(--surf);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px">
<button role="tab" aria-selected="{{isM}}" class="tap" onClick="{{showM}}" style="height:40px;border:0;border-radius:999px;font:700 14px var(--font);{{segM}}">Muscle</button>
<button role="tab" aria-selected="{{isE}}" class="tap" onClick="{{showE}}" style="height:40px;border:0;border-radius:999px;font:700 14px var(--font);{{segE}}">Equipment</button>
</div>

<div style="padding:0 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<a href="Muscle.dc.html" class="tap in" style="text-decoration:none;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:var(--surf);border:1px solid var(--line);{{t.delay}}">
<span style="aspect-ratio:1 / 1;background:repeating-linear-gradient(135deg,var(--surf) 0 10px,var(--raised) 10px 20px);display:flex;align-items:flex-end;padding:8px 10px;box-sizing:border-box;font:500 10px var(--mono);color:var(--muted)">{{t.ph}}</span>
<span style="padding:10px 12px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:6px"><span style="font-size:15px;font-weight:700">{{t.n}}</span><span style="font:500 12px var(--mono);color:var(--muted)">{{t.c}}</span></span>
</a>
</sc-for>
</div>

<section style="margin-top:30px;display:flex;flex-direction:column;gap:12px">
<div style="padding:0 20px;display:flex;flex-direction:column;gap:2px"><h2 style="margin:0;font-size:20px;font-weight:800">Featured today</h2><p style="margin:0;font-size:14px;color:var(--muted)">A different selection each day.</p></div>
<div class="snap" style="display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px;scroll-padding:0 20px">
<sc-for list="{{featured}}" as="f" hint-placeholder-count="3">
<a href="Exercise.dc.html" class="tap" style="flex:0 0 210px;scroll-snap-align:start;text-decoration:none;display:flex;flex-direction:column;gap:8px">
<span style="position:relative;aspect-ratio:3 / 4;border-radius:var(--r);background:repeating-linear-gradient(135deg,var(--surf) 0 10px,var(--raised) 10px 20px);display:flex;align-items:flex-end;padding:12px;box-sizing:border-box;font:500 10px var(--mono);color:var(--muted)">[demo loop]
<span style="position:absolute;top:10px;left:10px;height:26px;padding:0 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;gap:5px;font:600 10px var(--mono);letter-spacing:.06em"><svg width="10" height="10" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor" /></svg>VIDEO</span></span>
<span style="font-size:16px;font-weight:700;line-height:1.25">{{f.n}}</span>
<span style="font-size:13px;color:var(--muted);margin-top:-4px">{{f.m}}</span>
</a>
</sc-for>
</div>
</section>
</main>

<nav aria-label="Primary" style="position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:6px 6px 22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:color-mix(in srgb, var(--bg) 84%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:6">
<a href="Main.dc.html" class="tap" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600"><span style="display:flex;width:52px;height:30px;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" /></svg></span>Home</a>
<a href="Library.dc.html" aria-current="page" class="tap" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--ink);font-size:11px;font-weight:700"><span style="display:flex;width:52px;height:30px;align-items:center;justify-content:center;border-radius:999px;background:var(--acc-soft);color:var(--acc-ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /></svg></span>Library</a>
<a href="Gate.dc.html" aria-label="Join GYMMER free" class="tap" style="justify-self:center;display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:-22px;text-decoration:none;color:var(--ink);font-size:11px;font-weight:700"><span style="width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--bg), 0 0 0 4px var(--line)"><svg width="26" height="26" viewBox="140 140 748 748" aria-hidden="true"><path style="fill:currentColor" fill-rule="evenodd" d="M842.55 184.55 771.7 255.41 512 255.41Q459.78 255.41 412.13 275.56Q366.09 295.04 330.56 330.56Q295.04 366.09 275.56 412.13Q255.41 459.78 255.41 512Q255.41 564.22 275.56 611.87Q295.04 657.91 330.56 693.44Q366.09 728.96 412.13 748.44Q459.78 768.59 512 768.59Q564.22 768.59 611.87 748.44Q657.91 728.96 693.44 693.44Q728.96 657.91 748.44 611.87Q764.03 575.01 767.56 535.41H488.59V424.59H869.38L872.99 443.65Q883.67 500.07 876.67 556.9Q869.82 612.49 846.67 663.59Q823.53 714.69 786.26 756.5Q748.16 799.25 698.7 828.43Q649.23 857.62 593.4 870.3Q538.78 882.7 482.86 878.25Q426.94 873.8 374.97 852.92Q321.83 831.57 277.61 794.93Q233.38 758.29 202.52 710.06Q172.34 662.88 157.56 608.77Q142.79 554.65 144.81 498.68Q146.88 441.45 166.35 387.43Q185.83 333.4 220.74 288.01Q254.89 243.62 300.79 211.37Q346.69 179.12 400.03 162.05Q454.57 144.59 512 144.59L882.51 144.59Z" /></svg></span>Join free</a>
<a href="Articles.dc.html" class="tap" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600"><span style="display:flex;width:52px;height:30px;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 4h11l3 3v13H5z" /><path d="M8 10h8M8 14h8M8 18h5" /></svg></span>Learn</a>
<a href="Dashboard.dc.html" class="tap" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600"><span style="display:flex;width:52px;height:30px;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="8" r="4" /><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" /></svg></span>Sign in</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff563c","options":["#ff563c","#c8f031","#5cc8ff","#a08bff"]},"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"corner":{"editor":"enum","options":["square","soft","round"],"default":"soft"},"type":{"editor":"enum","options":["Archivo + Plex Mono","Archivo + Google Sans Flex"],"default":"Archivo + Google Sans Flex"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    var p = this.props;
    var acc = p.accent || '#ff563c', mode = p.mode || 'dark', corner = p.corner || 'soft', dark = mode !== 'light';
    var h = acc.replace('#', ''); if (h.length === 3) { h = h.split('').map(function (c) { return c + c; }).join(''); }
    var n = parseInt(h, 16);
    var L = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    L = 0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2];
    var t = dark ? { bg: '#141312', surf: '#1d1b1a', raised: '#2a2725', ink: '#efebe7', body: '#c4beb8', muted: '#959089', line: 'rgba(239,235,231,0.12)' }
                 : { bg: '#f3f2f2', surf: '#eae9e9', raised: '#fbfafa', ink: '#201e1d', body: '#3f3c3b', muted: '#605d5d', line: 'rgba(32,30,29,0.14)' };
    var r = corner === 'square' ? 0 : (corner === 'round' ? 20 : 12);
    return '--acc:' + acc + ';--on-acc:' + (L > 0.179 ? '#141312' : '#ffffff') + ';--acc-ink:' + (dark ? acc : 'color-mix(in oklch, ' + acc + ' 62%, #000)') +
      ';--acc-soft:color-mix(in srgb, ' + acc + ' 16%, transparent);--bg:' + t.bg + ';--surf:' + t.surf + ';--raised:' + t.raised + ';--ink:' + t.ink +
      ';--body:' + t.body + ';--muted:' + t.muted + ';--line:' + t.line + ';--r:' + r + 'px;--rs:' + Math.round(r * 0.6) + 'px;--display:Archivo, system-ui, sans-serif;' + (p.type === 'Archivo + Plex Mono' ? '--font:Archivo, system-ui, sans-serif;--mono:IBM Plex Mono, ui-monospace, monospace;' : '--font:Google Sans Flex, Archivo, system-ui, sans-serif;--mono:Google Sans Flex, system-ui, sans-serif;');
  }
  renderVals() {
    var self = this;
    var seg = (this.state && this.state.seg) || 'm';
    var on = 'background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)';
    var off = 'background:transparent;color:var(--muted)';
    var muscles = [['Back', 72], ['Biceps', 68], ['Glutes', 61], ['Quadriceps', 55], ['Lats', 48], ['Triceps', 48], ['Chest', 42], ['Hamstrings', 38], ['Shoulders', 38], ['Abdominals', 37]];
    var equipment = [['Dumbbell', 96], ['Bodyweight', 91], ['Cable Machine', 78], ['Bench', 42], ['Barbell', 36], ['Incline Bench', 30], ['Machine', 29], ['Kettlebell', 24], ['Smith Machine', 18], ['EZ Bar', 8]];
    var src = seg === 'm' ? muscles : equipment;
    return {
      vars: this.theme(),
      isM: seg === 'm' ? 'true' : 'false', isE: seg === 'e' ? 'true' : 'false',
      segM: seg === 'm' ? on : off, segE: seg === 'e' ? on : off,
      showM: function () { self.setState({ seg: 'm' }); },
      showE: function () { self.setState({ seg: 'e' }); },
      tiles: src.map(function (x, i) { return { n: x[0], c: String(x[1]), ph: seg === 'm' ? '[muscle render]' : '[equipment photo]', delay: 'animation-delay:' + (i * 0.03).toFixed(2) + 's' }; }),
      featured: [
        { n: 'Bent Over Barbell Row', m: 'Back · Lats' },
        { n: 'One Arm Dumbbell Preacher Curl', m: 'Biceps' },
        { n: 'Incline Dumbbell Hammer Press', m: 'Upper chest · Chest' },
        { n: 'Alternate Incline Dumbbell Curl', m: 'Biceps' }
      ]
    };
  }
}
</script>
</body>
</html>
