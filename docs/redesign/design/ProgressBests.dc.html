<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress — bests &amp; exercise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:is(h1,h2,h3,[style*="font-stretch"]):not([style*="var(--mono)"]){font-family:var(--display)!important}
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.in{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.tap{transition:transform .12s ease-out,background-color .2s}
.tap:active{transform:scale(.97)}
.scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="{{vars}}width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)">
<main class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding-bottom:40px;box-sizing:border-box">

<div style="position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 8px;background:color-mix(in srgb, var(--bg) 86%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)">
<a href="Dashboard.dc.html" class="tap" style="justify-self:start;height:44px;display:flex;align-items:center;gap:2px;padding:0 8px;text-decoration:none;color:var(--acc-ink);font-size:16px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6" /></svg>Today</a>
<span style="font-size:16px;font-weight:700">Progress</span><span></span>
</div>

<div aria-hidden="true" style="margin:12px 16px 0;height:64px;border-radius:var(--r);background:var(--surf);display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em">↑ RANGE · BODY MAP · MUSCLES (BOARD 23)</div>

<section style="margin-top:24px">
<div style="margin:0 20px 6px;display:flex;justify-content:space-between;align-items:baseline"><h2 style="margin:0;font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted)">BEST SETS</h2><span style="font:500 11px var(--mono);color:var(--muted)">30D</span></div>
<ol style="list-style:none;margin:0;padding:0">
<sc-for list="{{bests}}" as="b" hint-placeholder-count="5">
<li><a href="Exercise.dc.html" class="tap" style="display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 20px;text-decoration:none;border-bottom:1px solid var(--line)">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">{{b.n}}</span><span style="font:500 12px var(--mono);color:var(--muted)">{{b.d}}</span></span>
<span style="font:700 15px var(--mono)">{{b.v}}</span>
</a></li>
</sc-for>
</ol>
</section>

<section style="margin:28px 16px 0;padding:16px;border-radius:var(--r);background:var(--surf);display:flex;flex-direction:column;gap:14px">
<h2 style="margin:0;font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted)">EXERCISE</h2>
<button class="tap" style="height:52px;border-radius:var(--rs);border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 16px var(--font);display:flex;align-items:center;gap:10px;padding:0 14px;text-align:left"><span style="flex:1">Bench Press</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="m6 9 6 6 6-6" /></svg></button>
<div role="tablist" aria-label="Metric" style="padding:4px;border-radius:999px;background:var(--bg);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px">
<sc-for list="{{metrics}}" as="m" hint-placeholder-count="2">
<button role="tab" aria-selected="{{m.sel}}" class="tap" onClick="{{m.pick}}" style="height:44px;border:0;border-radius:999px;font:700 14px var(--font);{{m.style}}">{{m.n}}</button>
</sc-for>
</div>
<svg viewBox="0 0 326 150" width="100%" role="img" aria-label="{{chartLabel}}" style="display:block">
<g stroke="var(--line)" stroke-width="1"><line x1="34" y1="20" x2="326" y2="20" /><line x1="34" y1="70" x2="326" y2="70" /><line x1="34" y1="120" x2="326" y2="120" /></g>
<g style="font:500 10px var(--mono)" fill="var(--muted)"><text x="0" y="24">{{y2}}</text><text x="0" y="74">{{y1}}</text><text x="0" y="124">{{y0}}</text><text x="34" y="145">{{x0}}</text><text x="290" y="145">{{x1}}</text></g>
<polyline points="{{pts}}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="{{lastX}}" cy="{{lastY}}" r="4.5" fill="var(--acc)" stroke="var(--surf)" stroke-width="2" />
</svg>
<dl style="margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<div style="padding:10px 12px;border-radius:var(--rs);background:var(--bg)"><dd style="margin:0;font-size:18px;font-weight:800">{{best}}</dd><dt style="font:500 10px var(--mono);letter-spacing:.06em;color:var(--muted)">BEST</dt></div>
<div style="padding:10px 12px;border-radius:var(--rs);background:var(--bg)"><dd style="margin:0;font-size:18px;font-weight:800">8</dd><dt style="font:500 10px var(--mono);letter-spacing:.06em;color:var(--muted)">SESSIONS</dt></div>
<div style="padding:10px 12px;border-radius:var(--rs);background:var(--bg)"><dd style="margin:0;font-size:18px;font-weight:800">Tue</dd><dt style="font:500 10px var(--mono);letter-spacing:.06em;color:var(--muted)">LAST</dt></div>
</dl>
<button class="tap" style="height:48px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:700 15px var(--font);display:flex;align-items:center;justify-content:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>Export CSV</button>
</section>

<a href="History.dc.html" class="tap" style="margin:16px 16px 0;min-height:56px;padding:0 16px;border-radius:var(--r);background:var(--surf);display:flex;align-items:center;gap:12px;text-decoration:none">
<span style="flex:1;font-size:16px;font-weight:700">History</span><span style="font:500 13px var(--mono);color:var(--muted)">12</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="m9 18 6-6-6-6" /></svg></a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff563c","options":["#ff563c","#c8f031","#5cc8ff","#a08bff"]},"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"corner":{"editor":"enum","options":["square","soft","round"],"default":"soft"},"type":{"editor":"enum","options":["Archivo + Plex Mono","Archivo + Google Sans Flex"],"default":"Archivo + Google Sans Flex"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    var p = this.props;
    var acc = p.accent || '#ff563c', mode = p.mode || 'dark', corner = p.corner || 'soft', dark = mode !== 'light';
    var h = acc.replace('#', ''); if (h.length === 3) { h = h.split('').map(function (c) { return c + c; }).join(''); }
    var n = parseInt(h, 16);
    var L = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    L = 0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2];
    var t = dark ? { bg: '#141312', surf: '#1d1b1a', raised: '#2a2725', ink: '#efebe7', body: '#c4beb8', muted: '#959089', line: 'rgba(239,235,231,0.12)' }
                 : { bg: '#f3f2f2', surf: '#eae9e9', raised: '#fbfafa', ink: '#201e1d', body: '#3f3c3b', muted: '#605d5d', line: 'rgba(32,30,29,0.14)' };
    var r = corner === 'square' ? 0 : (corner === 'round' ? 20 : 12);
    return '--acc:' + acc + ';--on-acc:' + (L > 0.179 ? '#141312' : '#ffffff') + ';--acc-ink:' + (dark ? acc : 'color-mix(in oklch, ' + acc + ' 62%, #000)') +
      ';--acc-soft:color-mix(in srgb, ' + acc + ' 16%, transparent);--bg:' + t.bg + ';--surf:' + t.surf + ';--raised:' + t.raised + ';--ink:' + t.ink +
      ';--body:' + t.body + ';--muted:' + t.muted + ';--line:' + t.line + ';--r:' + r + 'px;--rs:' + Math.round(r * 0.6) + 'px;--display:Archivo, system-ui, sans-serif;' + (p.type === 'Archivo + Plex Mono' ? '--font:Archivo, system-ui, sans-serif;--mono:IBM Plex Mono, ui-monospace, monospace;' : '--font:Google Sans Flex, Archivo, system-ui, sans-serif;--mono:Google Sans Flex, system-ui, sans-serif;');
  }
  renderVals() {
    var self = this, s = this.state || {}, metric = s.metric || 'best';
    var segOn = 'background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)', segOff = 'background:transparent;color:var(--muted)';
    var series = metric === 'best' ? [80, 82.5, 82.5, 85, 87.5, 87.5, 90, 92.5] : [2400, 2650, 2500, 2900, 3100, 2950, 3300, 3450];
    var lo = Math.min.apply(null, series), hi = Math.max.apply(null, series), span = (hi - lo) || 1;
    var pts = series.map(function (v, i) { return [34 + i * (286 / (series.length - 1)), 120 - (v - lo) / span * 100]; });
    var fmt = function (v) { return metric === 'best' ? (v + ' kg') : (v.toLocaleString('en') + ''); };
    return {
      vars: this.theme(),
      bests: [
        { n: 'Bench Press', v: '92.5 kg × 5', d: 'TUE' },
        { n: 'Back Squat', v: '120 kg × 3', d: 'MON' },
        { n: 'Pull-up', v: '+10 kg × 6', d: '12 OCT' },
        { n: 'Overhead Press', v: '55 kg × 6', d: '10 OCT' },
        { n: 'Plank', v: '1:30', d: '8 OCT' }
      ],
      metrics: [['best', 'Best set'], ['volume', 'Volume']].map(function (m) { return { n: m[1], sel: m[0] === metric ? 'true' : 'false', style: m[0] === metric ? segOn : segOff, pick: function () { self.setState({ metric: m[0] }); } }; }),
      pts: pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '),
      lastX: pts[pts.length - 1][0].toFixed(1), lastY: pts[pts.length - 1][1].toFixed(1),
      y0: metric === 'best' ? String(lo) : '2.4k', y1: metric === 'best' ? String((lo + hi) / 2) : '2.9k', y2: metric === 'best' ? String(hi) : '3.5k',
      x0: '20 SEP', x1: 'TUE',
      best: metric === 'best' ? '92.5 kg' : '3,450',
      chartLabel: metric === 'best' ? 'Bench Press best set, 80 to 92.5 kg over 8 sessions' : 'Bench Press volume, 2,400 to 3,450 kg over 8 sessions'
    };
  }
}
</script>
</body>
</html>
