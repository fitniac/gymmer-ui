<script type="text/x-dc" data-dc-script data-props='{"levels":{"editor":null},"view":{"editor":"enum","options":["both","front","back"],"default":"both"},"focus":{"editor":"text","default":""},"labels":{"editor":"boolean","default":true},"sex":{"editor":"enum","options":["male","female"],"default":"male"},"$preview":{"width":360,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var lv = p.levels || { chest: 3, shoulders: 2, triceps: 2, biceps: 1, lats: 3, rhomboids: 2, traps: 1, rearDelts: 1, quads: 1, glutes: 1, abs: 1 };
    var focus = p.focus || '';
    var view = p.view || 'both';
    var keys = ['shoulders', 'chest', 'biceps', 'abs', 'forearms', 'quads', 'calves', 'traps', 'rearDelts', 'rhomboids', 'lats', 'lowerBack', 'triceps', 'glutes', 'hamstrings'];
    var mix = { 1: 38, 2: 68, 3: 100 };
    var f = {};
    keys.forEach(function (k) {
      var l = lv[k] || 0;
      var fill = l ? (l >= 3 ? 'var(--bm-acc)' : 'color-mix(in srgb, var(--bm-acc) ' + mix[l] + '%, var(--bm-body))') : 'transparent';
      var dim = focus && focus !== k ? ';opacity:.35' : '';
      if (focus === k) { fill = 'var(--bm-acc)'; }
      f[k] = 'fill:' + fill + dim + ';transition:fill .3s ease,opacity .3s ease';
    });
    var trained = keys.filter(function (k) { return lv[k]; });
    return {
      f: f,
      showFront: view !== 'back', showBack: view !== 'front', male: (p.sex || 'male') !== 'female', female: p.sex === 'female',
      labels: p.labels !== false,
      rootStyle: '--bm-acc:var(--acc, #ff563c);--bm-body:var(--raised, #2a2725);--bm-gap:var(--bg, #141312);',
      aria: 'Body map (' + (p.sex === 'female' ? 'female' : 'male') + ' figure). Trained: ' + (trained.length ? trained.join(', ') : 'none')
    };
  }
}
</script>
