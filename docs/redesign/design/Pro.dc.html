<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GYMMER Pro — 7-day free trial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:is(h1,h2,h3,[style*="font-stretch"]):not([style*="var(--mono)"]){font-family:var(--display)!important}
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet{animation:sheet .48s cubic-bezier(.32,.72,0,1) both}
.in{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.tap{transition:transform .12s ease-out,border-color .2s,background-color .2s}
.tap:active{transform:scale(.97)}
.scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="{{vars}}width:390px;height:844px;position:relative;overflow:hidden;background:rgba(0,0,0,.55);color:var(--ink);font-family:var(--font)">

<div role="dialog" aria-modal="true" aria-labelledby="pt" class="sheet" style="position:absolute;left:0;right:0;bottom:0;top:28px;border-radius:calc(var(--r) * 2) calc(var(--r) * 2) 0 0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden">
<div class="scroll" style="flex:1;overflow-y:auto;padding:10px 20px 16px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="height:26px;padding:0 9px 0 6px;border-radius:4px;background:var(--ink);color:var(--bg);font:700 11px var(--mono);letter-spacing:.1em;display:flex;align-items:center;gap:6px"><svg width="15" height="15" viewBox="140 140 748 748" aria-hidden="true"><path style="fill:var(--acc)" fill-rule="evenodd" d="M842.55 184.55 771.7 255.41 512 255.41Q459.78 255.41 412.13 275.56Q366.09 295.04 330.56 330.56Q295.04 366.09 275.56 412.13Q255.41 459.78 255.41 512Q255.41 564.22 275.56 611.87Q295.04 657.91 330.56 693.44Q366.09 728.96 412.13 748.44Q459.78 768.59 512 768.59Q564.22 768.59 611.87 748.44Q657.91 728.96 693.44 693.44Q728.96 657.91 748.44 611.87Q764.03 575.01 767.56 535.41H488.59V424.59H869.38L872.99 443.65Q883.67 500.07 876.67 556.9Q869.82 612.49 846.67 663.59Q823.53 714.69 786.26 756.5Q748.16 799.25 698.7 828.43Q649.23 857.62 593.4 870.3Q538.78 882.7 482.86 878.25Q426.94 873.8 374.97 852.92Q321.83 831.57 277.61 794.93Q233.38 758.29 202.52 710.06Q172.34 662.88 157.56 608.77Q142.79 554.65 144.81 498.68Q146.88 441.45 166.35 387.43Q185.83 333.4 220.74 288.01Q254.89 243.62 300.79 211.37Q346.69 179.12 400.03 162.05Q454.57 144.59 512 144.59L882.51 144.59Z" /></svg>PRO</span>
<a href="{{backHref}}" aria-label="Close" class="tap" style="width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:var(--muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" /></svg></a>
</div>

<div class="in" style="display:flex;flex-direction:column;gap:8px">
<h2 id="pt" style="margin:0;font-size:30px;line-height:1.05;font-weight:800;font-stretch:110%;letter-spacing:-.015em;text-wrap:balance">{{headline}}</h2>
<span style="font:600 12px var(--mono);letter-spacing:.06em;color:var(--acc-ink)">{{sub}}</span>
</div>

<div role="table" aria-label="Free compared with Pro" class="in" style="animation-delay:.05s;border-radius:var(--r);background:var(--surf);overflow:hidden">
<div role="row" style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);padding:10px 14px;font:600 10px var(--mono);letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line)"><span role="columnheader"></span><span role="columnheader">FREE</span><span role="columnheader" style="color:var(--ink)">PRO</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div role="row" style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);{{r.hl}}">
<span role="rowheader" style="font-size:14px;font-weight:700;line-height:1.25">{{r.k}}</span>
<span role="cell" style="font-size:13px;color:var(--muted);line-height:1.3">{{r.f}}</span>
<span role="cell" style="font-size:13px;font-weight:700;line-height:1.3">{{r.p}}</span>
</div>
</sc-for>
</div>

</div>

<div style="padding:12px 16px 28px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px">
<sc-if value="{{isOffer}}" hint-placeholder-val="{{ true }}"><button class="tap" style="height:56px;border:0;border-radius:999px;background:var(--acc);color:var(--on-acc);font:700 17px var(--font)">Try Pro free · 7 days</button>
<a href="{{backHref}}" class="tap" style="height:44px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:600;font-size:15px;color:var(--body)">Not now</a></sc-if>
<sc-if value="{{isStarted}}" hint-placeholder-val="{{ false }}"><a href="{{backHref}}" class="tap" style="height:56px;border-radius:999px;background:var(--acc);color:var(--on-acc);font:700 17px var(--font);display:flex;align-items:center;justify-content:center;text-decoration:none">Done</a></sc-if>
<sc-if value="{{isUsed}}" hint-placeholder-val="{{ false }}"><a href="{{backHref}}" class="tap" style="height:56px;border-radius:999px;border:1px solid var(--line);color:var(--ink);font:700 17px var(--font);display:flex;align-items:center;justify-content:center;text-decoration:none">Close</a></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff563c","options":["#ff563c","#c8f031","#5cc8ff","#a08bff"]},"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"corner":{"editor":"enum","options":["square","soft","round"],"default":"soft"},"trigger":{"editor":"enum","options":["programs","history","coach","ads","settings"],"default":"programs"},"state":{"editor":"enum","options":["offer","started","used"],"default":"offer"},"type":{"editor":"enum","options":["Archivo + Plex Mono","Archivo + Google Sans Flex"],"default":"Archivo + Google Sans Flex"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    var p = this.props;
    var acc = p.accent || '#ff563c', mode = p.mode || 'dark', corner = p.corner || 'soft', dark = mode !== 'light';
    var h = acc.replace('#', ''); if (h.length === 3) { h = h.split('').map(function (c) { return c + c; }).join(''); }
    var n = parseInt(h, 16);
    var L = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    L = 0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2];
    var t = dark ? { bg: '#141312', surf: '#1d1b1a', raised: '#2a2725', ink: '#efebe7', body: '#c4beb8', muted: '#959089', line: 'rgba(239,235,231,0.12)' }
                 : { bg: '#f3f2f2', surf: '#eae9e9', raised: '#fbfafa', ink: '#201e1d', body: '#3f3c3b', muted: '#605d5d', line: 'rgba(32,30,29,0.14)' };
    var r = corner === 'square' ? 0 : (corner === 'round' ? 20 : 12);
    return '--acc:' + acc + ';--on-acc:' + (L > 0.179 ? '#141312' : '#ffffff') + ';--acc-ink:' + (dark ? acc : 'color-mix(in oklch, ' + acc + ' 62%, #000)') +
      ';--acc-soft:color-mix(in srgb, ' + acc + ' 16%, transparent);--bg:' + t.bg + ';--surf:' + t.surf + ';--raised:' + t.raised + ';--ink:' + t.ink +
      ';--body:' + t.body + ';--muted:' + t.muted + ';--line:' + t.line + ';--r:' + r + 'px;--rs:' + Math.round(r * 0.6) + 'px;--display:Archivo, system-ui, sans-serif;' + (p.type === 'Archivo + Plex Mono' ? '--font:Archivo, system-ui, sans-serif;--mono:IBM Plex Mono, ui-monospace, monospace;' : '--font:Google Sans Flex, Archivo, system-ui, sans-serif;--mono:Google Sans Flex, system-ui, sans-serif;');
  }
  renderVals() {
    var self = this, trig = this.props.trigger || 'programs', st = this.props.state || 'offer';
    var heads = {
      programs: 'Unlimited programs',
      history: 'Every workout, forever',
      coach: 'Nova on every workout',
      ads: 'No ads',
      settings: 'Gymmer Pro'
    };
    var backs = { programs: 'Programs.dc.html', history: 'Dashboard.dc.html', coach: 'Coach.dc.html', ads: 'Rest.dc.html', settings: 'Settings.dc.html' };
    var rowKey = { programs: 3, history: 0, coach: 2, ads: 4, settings: -1 }[trig];
    var rows = [
      { k: 'Workout history', f: '30 days', p: 'Forever' },
      { k: 'Nova reviews', f: '—', p: 'Every workout' },
      { k: 'Ask Nova', f: '3 a week', p: 'Any time' },
      { k: 'Your programs', f: 'Up to 3', p: 'Unlimited' },
      { k: 'Ads', f: 'During rest', p: 'None' }
    ];
    return {
      vars: this.theme(),
      headline: heads[trig], backHref: backs[trig],
      rows: rows.map(function (r, i) { return Object.assign({}, r, { hl: i === rowKey ? 'background:var(--acc-soft)' : '' }); }),
      sub: st === 'started' ? 'PRO UNTIL 25 OCT' : (st === 'used' ? 'COMING SOON' : '7 DAYS FREE · NO CARD'),
      isOffer: st === 'offer', isStarted: st === 'started', isUsed: st === 'used'
    };
  }
}
</script>
</body>
</html>
