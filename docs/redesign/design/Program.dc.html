<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Program — Chest Day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:is(h1,h2,h3,[style*="font-stretch"]):not([style*="var(--mono)"]){font-family:var(--display)!important}
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.in{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.tap{transition:transform .12s ease-out}
.tap:active{transform:scale(.97)}
.scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="{{vars}}width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)">
<main class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding-bottom:120px;box-sizing:border-box">

<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0">
<a href="Programs.dc.html" class="tap" style="height:44px;display:flex;align-items:center;gap:2px;padding:0 8px;text-decoration:none;color:var(--acc-ink);font-size:16px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6" /></svg>Programs</a>
<div style="display:flex">
<button aria-label="Edit program" class="tap" style="width:44px;height:44px;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 20h4L19 9l-4-4L4 16z" /></svg></button>
<button aria-label="More options" class="tap" style="width:44px;height:44px;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8" /><circle cx="12" cy="12" r="1.8" /><circle cx="19" cy="12" r="1.8" /></svg></button>
</div>
</div>

<header style="padding:6px 20px 0;display:flex;gap:16px;align-items:flex-end">
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<span style="font:600 11px var(--mono);letter-spacing:.08em;color:var(--acc-ink)">BEGINNER</span>
<h1 style="margin:0;font-size:34px;line-height:1.02;font-weight:800;font-stretch:112%;letter-spacing:-.02em">Chest Day</h1>
<span style="font-size:14px;color:var(--body)">Chest · Upper chest</span>
</div>
<span style="flex:0 0 78px;height:110px;border-radius:var(--rs);background:var(--bg);padding:6px 0;box-sizing:border-box"><dc-import name="BodyMap" sex="{{figure}}" levels="{{bmChest}}" view="front" labels="{{ false }}" hint-size="100%,98px"></dc-import></span>
</header>

<dl style="margin:16px 20px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<div style="padding:10px 12px;border-radius:var(--rs);background:var(--surf)"><dd style="margin:0;font-size:20px;font-weight:800">4</dd><dt style="font:500 10px var(--mono);letter-spacing:.06em;color:var(--muted)">EXERCISES</dt></div>
<div style="padding:10px 12px;border-radius:var(--rs);background:var(--surf)"><dd style="margin:0;font-size:20px;font-weight:800">10</dd><dt style="font:500 10px var(--mono);letter-spacing:.06em;color:var(--muted)">WORK SETS</dt></div>
<div style="padding:10px 12px;border-radius:var(--rs);background:var(--surf)"><dd style="margin:0;font-size:20px;font-weight:800">~45<span style="font-size:13px;color:var(--muted)"> min</span></dd><dt style="font:500 10px var(--mono);letter-spacing:.06em;color:var(--muted)">DURATION</dt></div>
</dl>

<section style="margin-top:24px">
<h2 style="margin:0 20px 4px;font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted)">WARM-UP</h2>
<a href="ExerciseSheet.dc.html" style="display:flex;align-items:center;gap:14px;padding:8px 20px;text-decoration:none">
<span style="position:relative;flex:0 0 66px;height:88px;border-radius:var(--rs);overflow:hidden;background:repeating-linear-gradient(135deg,var(--surf) 0 8px,var(--raised) 8px 16px)"><span aria-hidden="true" style="position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.18)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" /></svg></span></span>
<span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-weight:700;font-size:16px">Treadmill Jogging</span><span style="font-size:13px;color:var(--muted)">5 min · easy pace</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="m9 18 6-6-6-6" /></svg>
</a>
</section>

<section style="margin-top:14px">
<div style="margin:0 20px 4px;display:flex;justify-content:space-between;align-items:baseline"><h2 style="margin:0;font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted)">MAIN WORK</h2><span style="font-size:12px;color:var(--muted)">Hold ≡ to reorder</span></div>
<ol style="list-style:none;margin:0;padding:0">
<sc-for list="{{ex}}" as="e" hint-placeholder-count="3">
<li class="in" style="{{e.delay}}">
<div style="display:flex;align-items:center;gap:14px;padding:8px 8px 8px 20px">
<a href="ExerciseSheet.dc.html" aria-label="Preview {{e.n}} — video, form and swaps" class="tap" style="position:relative;flex:0 0 66px;height:88px;border-radius:var(--rs);background:repeating-linear-gradient(135deg,var(--surf) 0 8px,var(--raised) 8px 16px)"><span aria-hidden="true" style="position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.18)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" /></svg></span><span style="position:absolute;left:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 11px var(--mono);display:flex;align-items:center;justify-content:center">{{e.i}}</span></a>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-weight:700;font-size:16px;line-height:1.25">{{e.n}}</span><span style="font-size:13px;color:var(--body)">{{e.t}}</span><span style="font:500 11px var(--mono);color:var(--muted)">{{e.m}}</span></span>
<button aria-label="Reorder" style="width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9h14M5 15h14" /></svg></button>
</div>
</li>
</sc-for>
</ol>
<button class="tap" style="margin:8px 20px 0;width:calc(100% - 40px);height:50px;border-radius:var(--rs);border:1.5px dashed var(--line);background:transparent;color:var(--ink);font:600 15px var(--font);display:flex;align-items:center;justify-content:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" /></svg>Add exercise</button>
</section>
</main>

<div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 28px;background:color-mix(in srgb, var(--bg) 86%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)">
<a href="Active.dc.html" class="tap" style="height:56px;border-radius:999px;background:var(--acc);color:var(--on-acc);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor" /></svg>Start workout</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff563c","options":["#ff563c","#c8f031","#5cc8ff","#a08bff"]},"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"corner":{"editor":"enum","options":["square","soft","round"],"default":"soft"},"figure":{"editor":"enum","options":["male","female"],"default":"male"},"type":{"editor":"enum","options":["Archivo + Plex Mono","Archivo + Google Sans Flex"],"default":"Archivo + Google Sans Flex"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    var p = this.props;
    var acc = p.accent || '#ff563c', mode = p.mode || 'dark', corner = p.corner || 'soft', dark = mode !== 'light';
    var h = acc.replace('#', ''); if (h.length === 3) { h = h.split('').map(function (c) { return c + c; }).join(''); }
    var n = parseInt(h, 16);
    var L = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    L = 0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2];
    var t = dark ? { bg: '#141312', surf: '#1d1b1a', raised: '#2a2725', ink: '#efebe7', body: '#c4beb8', muted: '#959089', line: 'rgba(239,235,231,0.12)' }
                 : { bg: '#f3f2f2', surf: '#eae9e9', raised: '#fbfafa', ink: '#201e1d', body: '#3f3c3b', muted: '#605d5d', line: 'rgba(32,30,29,0.14)' };
    var r = corner === 'square' ? 0 : (corner === 'round' ? 20 : 12);
    return '--acc:' + acc + ';--on-acc:' + (L > 0.179 ? '#141312' : '#ffffff') + ';--acc-ink:' + (dark ? acc : 'color-mix(in oklch, ' + acc + ' 62%, #000)') +
      ';--acc-soft:color-mix(in srgb, ' + acc + ' 16%, transparent);--bg:' + t.bg + ';--surf:' + t.surf + ';--raised:' + t.raised + ';--ink:' + t.ink +
      ';--body:' + t.body + ';--muted:' + t.muted + ';--line:' + t.line + ';--r:' + r + 'px;--rs:' + Math.round(r * 0.6) + 'px;--display:Archivo, system-ui, sans-serif;' + (p.type === 'Archivo + Plex Mono' ? '--font:Archivo, system-ui, sans-serif;--mono:IBM Plex Mono, ui-monospace, monospace;' : '--font:Google Sans Flex, Archivo, system-ui, sans-serif;--mono:Google Sans Flex, system-ui, sans-serif;');
  }
  renderVals() {
    var ex = [
      { n: 'Decline Barbell Bench Press', t: '3 × 10 reps', m: 'CHEST · REST 90S' },
      { n: 'Incline Dumbbell Hammer Press', t: '3 × 10 reps', m: 'UPPER CHEST · REST 90S' },
      { n: 'Incline Cable Press', t: '3 × 10 reps', m: 'UPPER CHEST · REST 90S' }
    ];
    return { vars: this.theme(), figure: this.props.figure || 'male', bmChest: { chest: 3, shoulders: 1, triceps: 1 }, ex: ex.map(function (e, i) { return Object.assign({}, e, { i: String(i + 1), delay: 'animation-delay:' + (i * 0.04).toFixed(2) + 's' }); }) };
  }
}
</script>
</body>
</html>
