<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&amp;display=swap">

<style>
:is(h1,h2,h3,[style*="font-stretch"]):not([style*="var(--mono)"]){font-family:var(--display)!important}
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kenburns{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.16) translate(-3%,-2%)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,12px)}}
.in{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.kb{animation:kenburns 9s ease-in-out infinite alternate}
.tap{transition:transform .12s ease-out,background-color .2s,border-color .2s,color .2s}
.tap:active{transform:scale(.97)}
.lift{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.card:hover .lift{transform:translateY(-4px)}
.card:hover .cover{animation:kenburns 6s ease-in-out infinite alternate}
.card:hover .nm{color:var(--acc-ink)}
.nm{transition:color .2s}
.toast{animation:toast 2.6s ease both}
.snap{scroll-snap-type:x mandatory}.snap>*{scroll-snap-align:start}
.snap::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>

<header style="margin:10px 20px 0;display:flex;flex-direction:column;gap:4px"><h1 style="margin:0;font-size:36px;font-weight:800;font-stretch:114%;letter-spacing:-.025em">Learn</h1><span style="font-size:15px;color:var(--muted)">Articles and program guides — with the exercises inside.</span></header>
<div class="scroll" role="tablist" aria-label="Topic" style="display:flex;gap:8px;overflow-x:auto;padding:14px 20px 6px">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="6"><button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" class="tap" style="flex:0 0 auto;height:38px;padding:0 14px;border-radius:999px;font:600 14px var(--font);cursor:pointer;{{t.style}}">{{t.n}}</button></sc-for>
</div>
<sc-if value="{{hasLead}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{lead}}" as="a" hint-placeholder-count="1">
<a href="Article.dc.html" class="card in" style="margin:12px 16px 0;text-decoration:none;display:flex;flex-direction:column;gap:8px">
<span class="lift" style="position:relative;display:block;aspect-ratio:3 / 2;border-radius:var(--r);overflow:hidden;background:var(--surf)"><span class="cover" style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,var(--surf) 0 10px,var(--raised) 10px 20px)"></span><span style="position:absolute;left:10px;top:10px;height:24px;padding:0 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;font:600 10px var(--mono);letter-spacing:.07em">{{a.topic}}</span>
<sc-if value="{{a.hasProg}}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:10px;bottom:10px;height:26px;padding:0 10px;border-radius:999px;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;font:700 11px var(--font)">Guide · {{a.prog}}</span></sc-if></span>
<span class="nm" style="font-size:22px;line-height:1.15;font-weight:800;font-stretch:106%">{{a.n}}</span>
<span style="font-size:14px;line-height:1.45;color:var(--body)">{{a.d}}</span>
<span style="font-size:12px;color:var(--muted)">{{a.mins}} · {{a.date}}</span>
</a>
</sc-for>
</sc-if>
<ul style="list-style:none;margin:14px 0 0;padding:0">
<sc-for list="{{rows}}" as="a" hint-placeholder-count="5">
<li class="in" style="{{a.delay}}"><a href="Article.dc.html" class="card" style="display:flex;gap:14px;padding:12px 20px;text-decoration:none;align-items:flex-start">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font:600 10px var(--mono);letter-spacing:.07em;color:var(--acc-ink)">{{a.topic}} · {{a.goal}}</span><span class="nm" style="font-size:16px;line-height:1.25;font-weight:700">{{a.n}}</span><span style="font-size:12px;color:var(--muted)">{{a.mins}}</span></span>

</a></li>
